[package]
name = "waqt"
version = "0.1.0"
edition = "2021"
description = "Waqt: prayer times, adhan, Hijri calendar, Qibla and more"
build = "build.rs"

[lib]
name = "waqt"
path = "src/lib.rs"

# Command-line interface. Not named `waqt`: Windows file names ignore case,
# so it would overwrite the installed Waqt.exe.
[[bin]]
name = "waqt-cli"
path = "src/main.rs"

# Desktop app: the web UI in a native window, plus the tray icon and the
# adhan scheduler.
[[bin]]
name = "waqt"
path = "src/desktop.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["gzip", "json"] }
rfd = "0.17"
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
toml = "0.8"
tray-icon = "0.26"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
